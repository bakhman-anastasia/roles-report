const KEY = "enc-page-pw:" + location.pathname;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  return new TextDecoder().decode(buf);
}

function show(html) {
  document.open(); document.write(html); document.close();
}

async function tryOpen(pw, remember) {
  const html = await decrypt(pw);
  try { remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (e) {}
  show(html);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    await tryOpen(document.getElementById("pw").value, document.getElementById("rem").checked);
  } catch (x) {
    err.textContent = "Неверный пароль";
    btn.disabled = false;
  }
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { await tryOpen(saved, true); }
    catch (x) { try { localStorage.removeItem(KEY); } catch (e) {} }
  }
})();
</script>
